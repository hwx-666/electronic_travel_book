# 自动部署工作流：main 分支更新后自动构建，并推送构建产物到 gh-pages 分支（GitHub Pages 从此分支发布）
# 触发条件：push 到 main（含 PR 合并）、手动触发（Actions 页点 Run workflow）
name: 自动部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run build

      - name: 推送 dist 到 gh-pages 分支（触发 GitHub Pages 重新发布）
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
